name: event-contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tooling
        run: pip install ruff==0.16.8
      - name: Lint event boundary
        run: ruff check gcpml tests examples/pubsub_dataflow_risk_features.py
      - name: Verify formatting
        run: ruff format --check gcpml tests examples/pubsub_dataflow_risk_features.py
      - name: Run admission tests
        run: python -m unittest discover -s tests -v
      - name: Compile dependency-free boundary
        run: python -m compileall -q gcpml tests
      - name: Verify Dataflow worker package
        run: pip wheel --no-deps --wheel-dir dist .
