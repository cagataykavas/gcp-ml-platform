name: stage-cloud-run

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable sha256 digest already published as ml-inference/inference
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      SERVICE_NAME: ml-inference
      IMAGE_REPOSITORY: ml-inference
      IMAGE_NAME: inference
    steps:
      - uses: actions/checkout@v7

      - name: Validate immutable release intent
        shell: bash
        run: |
          set -euo pipefail
          for required in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required repository variable: ${required}" >&2
              exit 2
            fi
          done
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be an exact lowercase sha256 digest" >&2
            exit 2
          fi
          printf 'image_uri=%s\n' "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${IMAGE_REPOSITORY}/${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"

      - id: auth
        name: Exchange GitHub OIDC token for short-lived Google credentials
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: google-github-actions/setup-gcloud@v3

      - name: Stage digest-pinned revision without production traffic
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$image_uri" \
            --no-traffic \
            --update-labels="release_run=${GITHUB_RUN_ID},release_sha=${GITHUB_SHA:0:12}" \
            --quiet

      - name: Verify staged revision readiness and immutable image
        shell: bash
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)')"
          if [[ -z "$revision" ]]; then
            echo "Cloud Run did not report a created revision" >&2
            exit 3
          fi
          ready="$(gcloud run revisions describe "$revision" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.conditions[?type=Ready].status)')"
          deployed_image="$(gcloud run revisions describe "$revision" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          if [[ "$ready" != "True" || "$deployed_image" != "$image_uri" ]]; then
            echo "Staged revision failed readiness or image-integrity verification" >&2
            exit 3
          fi
          printf '### Staged Cloud Run revision\n\n- Revision: `%s`\n- Image: `%s`\n- Traffic: `0%%`\n' \
            "$revision" "$deployed_image" >> "$GITHUB_STEP_SUMMARY"
