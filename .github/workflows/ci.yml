name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check examples pipelines
      - name: Compile Python examples
        run: python -m compileall -q examples pipelines
      - name: Verify monitoring SQL is present
        run: test -s monitoring/delayed_label_monitoring.sql

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
      - name: Terraform format
        run: terraform -chdir=infra fmt -check -diff
      - name: Terraform init without backend
        run: terraform -chdir=infra init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra validate
